name: Scrape sources to articles

# Runs daily so that Friday's triage is never a cold start, and the weekly
# post is drawn from a full week already in the database.
#
# 22:37 UTC daily, so it runs overnight UK time and the pile is waiting in the
# morning. GitHub does not run scheduled jobs on time: it queues them under
# load, and 06:00 UTC was consistently firing at 10:54 UTC — nearly five hours
# late, i.e. lunchtime. That delay cannot be configured away, so the schedule
# is set for where it actually lands rather than where it is written:
#
#     no delay          22:37 UTC = 23:37 BST, late evening
#     the usual delay   ~03:30 UTC = ~04:30 BST, overnight
#
# Either way it is finished before morning. The odd minute is deliberate:
# GitHub's queue is worst on the hour, so :37 waits less than :00.
#
# The publishing week is Friday to Thursday (week.anchor_day in
# config/domain.yml). Running late on Thursday closes that week overnight,
# ready for Friday, which is when the post gets written.
#
# --since-last-run reads started_at from the most recent successful scrape_runs
# row, so a missed day is picked up automatically rather than leaving a hole.
on:
  schedule:
    - cron: '37 22 * * *'
  workflow_dispatch:

concurrency:
  group: news-tracker-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=""
          for name in DATABASE_URL OPENAI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: required secret(s) unset/empty:$missing" >&2
            echo "Set them at Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          # DATABASE_URL selects the Postgres backend (Neon). If it is unset,
          # get_client() falls back to Supabase — see src/scraping/pg_client.py.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_PROVIDER: openai
          OPENAI_SUMMARY_MODEL: gpt-4.1-mini
        run: python -m src.scraping.run --since-last-run

      - name: Summarise the run
        if: always()
        run: echo "Scrape finished with status ${{ job.status }}"
