<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Sunset palette ─────────────────────────────────────────────────────── */
:root{
  --paper:#FFFBF7; --card:#FFFFFF; --panel:#FDF0E6; --sunk:#F7E5D7; --rule:#EFDDCC;
  --ink:#2E1B3F; --ink-2:#5C3D6E; --muted:#8C7291; --faint:#B9A6C0;
  --dusk:#3D2159; --dusk-2:#241239; --dusk-ink:#F7DFC8; --dusk-muted:#C4A6C6;
  --accent:#E85B2E; --accent-2:#F0864F; --accent-soft:#FDE6D9;
  --keep:#2E8B6F; --keep-soft:#E6F2EC;
  --reject:#B92B54; --reject-soft:#FBE3E9;
  --gold:#DE9A2E;
  --shadow:0 1px 2px rgba(46,27,63,.05), 0 4px 14px rgba(46,27,63,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191024; --card:#221632; --panel:#2A1B3D; --sunk:#33224A; --rule:#3A2751;
    --ink:#F4E9F5; --ink-2:#D8C4DD; --muted:#A78FAD; --faint:#7C6485;
    --accent-soft:#3A2033; --keep-soft:#1B3A31; --reject-soft:#3A1B28;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit}

/* ── Masthead ───────────────────────────────────────────────────────────── */
.masthead{background:linear-gradient(135deg,var(--dusk) 0%,var(--dusk-2) 100%);
  padding:22px 0 20px;border-bottom:3px solid var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.masthead h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:30px;letter-spacing:-.4px;color:var(--dusk-ink);line-height:1.1}
.masthead .standfirst{margin:7px 0 0;max-width:56ch;font-size:14px;line-height:1.5;
  color:var(--dusk-muted);letter-spacing:.1px}

/* ── Category tabs ──────────────────────────────────────────────────────
   Drawn as real tabs: each sits in its own bordered shape with rounded top
   corners, and the active one drops its bottom border so it reads as joined
   to the content beneath rather than as a link that happens to be underlined. */
.tabs{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.tabs .row{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
  padding:9px 0 0;margin-bottom:-1px}
.tabs .row::-webkit-scrollbar{display:none}
/* The row scrolls, but the scrollbar is hidden, so without these the tabs
   past the fold are simply unreachable. */
.tabs .wrap{position:relative}
.tabnav{position:absolute;top:9px;bottom:0;width:34px;z-index:2;cursor:pointer;
  border:0;padding:0;font:400 22px/1 system-ui;color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.tabnav[hidden]{display:none}
.tabnav.prev{left:0;background:linear-gradient(90deg,var(--paper) 62%,transparent)}
.tabnav.next{right:0;background:linear-gradient(270deg,var(--paper) 62%,transparent)}
.tabnav:hover{color:var(--accent)}
.tab{display:flex;align-items:center;gap:7px;padding:9px 15px 8px;
  text-decoration:none;font-size:13.5px;font-weight:500;color:var(--muted);
  white-space:nowrap;background:var(--panel);
  border:1px solid var(--rule);border-bottom-color:var(--rule);
  border-radius:9px 9px 0 0;transition:background .12s,color .12s}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;
  border-bottom-color:var(--card);
  box-shadow:inset 0 3px 0 var(--accent)}
.tab .n{font-size:11px;font-weight:600;background:var(--sunk);color:var(--muted);
  border-radius:9px;padding:1px 7px;line-height:1.5}
.tab.on .n{background:var(--accent);color:#fff}

/* ── Filter row ─────────────────────────────────────────────────────────── */
/* Two columns: a left rail for place, and the article list. The rail is
   sticky so the filter stays reachable while scrolling a long week. */
.cols{display:grid;grid-template-columns:132px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:64px;padding-top:18px}
.rail h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--faint)}
.rail a{display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;margin-bottom:2px;border-radius:7px;text-decoration:none;
  font-size:13.5px;color:var(--muted);transition:background .12s,color .12s}
.rail a:hover{background:var(--panel);color:var(--ink)}
.rail a.on{background:var(--ink);color:var(--paper);font-weight:600}
.rail .sect{margin-top:22px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
  padding:14px 0 6px;font-size:13px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:20px;text-decoration:none;font-size:12.5px;
  color:var(--muted);border:1px solid var(--rule);transition:all .12s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.sep{width:1px;height:20px;background:var(--rule)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
input[type=search],select{padding:7px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);font:inherit;font-size:13px;color:var(--ink)}
input[type=search]{width:220px}
input[type=search]:focus,select:focus{outline:2px solid var(--accent-2);outline-offset:-1px;border-color:transparent}

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn{padding:6px 13px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.btn:hover{background:var(--sunk);border-color:var(--faint)}
.btn.keep:hover{background:var(--keep);border-color:var(--keep);color:#fff}
.btn.reject:hover{background:var(--reject);border-color:var(--reject);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}

/* ── Article cards ──────────────────────────────────────────────────────── */
.count{color:var(--muted);font-size:13px}
.list{margin:18px 0 0}
.filters{border-bottom:1px solid var(--rule)}
.item{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:17px 19px;margin-bottom:11px;box-shadow:var(--shadow);
  transition:box-shadow .15s,transform .15s}
.item:hover{box-shadow:0 2px 4px rgba(46,27,63,.07),0 8px 22px rgba(46,27,63,.07)}
.item.kept{border-left:4px solid var(--keep)}
.item.rejected{border-left:4px solid var(--reject);opacity:.5}
.item h2{margin:0 0 7px;font-family:Fraunces,Georgia,serif;font-size:19px;
  font-weight:600;line-height:1.3;letter-spacing:-.2px}
.item h2 a{text-decoration:none}
.item h2 a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  color:var(--muted);font-size:12.5px;margin-bottom:9px}
.meta .src{font-weight:600;color:var(--ink-2)}
.meta .dot{color:var(--faint)}
/* Category badge. Each category gets its own colour so the current one is
   readable at a glance rather than being one grey crumb among several. */
/* Kicker: the category on its own line above the headline, the way a
   publication labels a section, rather than one crumb among source and date. */
.kicker{display:inline-block;margin-bottom:6px;font-size:11px;font-weight:700;
  letter-spacing:.9px;text-transform:uppercase;padding:3px 9px;border-radius:5px;color:#fff}
.kick-governance{background:#7B4FA8}
.kick-geopolitics{background:#B92B54}
.kick-safety{background:#2E8B6F}
.kick-research{background:#4A63A8}
.kick-technical{background:#DE9A2E}
.kick-deployment{background:#C4622E}
.kick-podcasts{background:#5C3D6E}
.kick-papers{background:#3E6B63}
.relevant{display:inline-flex;align-items:center;gap:6px;font-size:13px;
  color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.relevant input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer;margin:0}
.relevant:hover{color:var(--ink)}
.item.picked{border-left:4px solid var(--gold)}
.item.picked .relevant{color:var(--ink);font-weight:600}
.ideas{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.ideas textarea{width:100%;box-sizing:border-box;padding:7px 9px;font:inherit;
  font-size:12.5px;line-height:1.45;resize:vertical;border:1px solid var(--rule);
  border-radius:8px;background:var(--card);color:var(--ink)}
.ideas textarea:focus{outline:2px solid var(--accent-2);outline-offset:-1px;
  border-color:transparent}
.ideas .btn{margin-top:6px;width:100%;justify-content:center}
.ideacount{margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.dgroup{margin:26px 0 0}
.dhead{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0 0 10px;
  padding-bottom:6px;border-bottom:2px solid var(--accent)}
.dn{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);
  border-radius:9px;padding:1px 8px;vertical-align:middle;margin-left:6px}
.ditem{padding:12px 0 12px 14px;border-left:3px solid var(--rule);margin-bottom:4px}
.ditem.picked{border-left-color:var(--gold)}
.ditem h3{margin:0 0 3px;font-size:16px;line-height:1.35;font-weight:600}
.ditem h3 a{color:var(--ink);text-decoration:none}
.ditem h3 a:hover{color:var(--accent);text-decoration:underline}
.dmeta{margin:0 0 6px;font-size:12px;color:var(--muted)}
.hi{background:var(--gold);color:#fff;border-radius:5px;padding:1px 6px;
  font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  margin-left:6px}
.dsum{margin:0 0 5px;font-size:14px;line-height:1.55}
.dwhy{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2);font-style:italic}
.dnote{margin:6px 0 0;font-size:13px;padding:6px 10px;border-radius:7px;
  background:var(--accent-soft);color:var(--ink-2)}
.empty{padding:40px 0;color:var(--muted)}
.askform{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.askform input[type=search]{flex:1;min-width:280px;padding:11px 14px;font-size:15px}
.answer{white-space:pre-wrap;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--accent);border-radius:10px;padding:16px 18px;
  margin:16px 0 26px;font-size:15px;line-height:1.62}
.spot{color:#1B7F45;text-decoration:none;font-weight:600}
.spot:hover{text-decoration:underline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .spot{color:#4ECB7B}}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.2px}
.pill.kept{background:var(--keep-soft);color:var(--keep)}
.pill.rejected{background:var(--reject-soft);color:var(--reject)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tag{background:var(--panel);border-radius:6px;padding:2px 8px;
  font-size:11.5px;color:var(--ink-2)}
.summary{font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:10px 0 0;
  background:var(--panel);border-left:3px solid var(--accent-2);
  padding:11px 14px;border-radius:0 8px 8px 0}
.matters{margin-top:11px;background:var(--accent-soft);border-radius:9px;
  padding:11px 14px}
.matters b{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.matters p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:13px;
  padding-top:12px;border-top:1px solid var(--rule)}
.acts form{display:inline-flex;gap:7px}
.acts select{font-size:12.5px;padding:5px 9px}

/* ── Pager & footer ─────────────────────────────────────────────────────── */
.tosort{font-size:12.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:5px 11px;border-radius:8px;white-space:nowrap}
.notes{margin-top:11px}
.note{position:relative;background:var(--accent-soft);border-radius:8px;
  padding:8px 30px 8px 12px;margin-bottom:5px;font-size:13.5px;color:var(--ink-2)}
.note .when{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.note .del{position:absolute;top:5px;right:6px}
.note .x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;
  line-height:1;padding:2px 4px}
.note .x:hover{color:var(--reject)}
.notef{flex:1;min-width:190px}
.notef{display:flex;gap:7px;align-items:flex-start;width:100%}
.notef textarea{flex:1;min-height:38px;padding:8px 11px;border:1px solid var(--rule);
  border-radius:8px;font:inherit;font-size:13.5px;line-height:1.5;resize:vertical;
  background:var(--card);color:var(--ink)}
.notef textarea:focus{outline:2px solid var(--accent-2);outline-offset:-1px;border-color:transparent}
.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:26px 0 10px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
footer{color:var(--faint);font-size:11.5px;padding:24px 0 40px;text-align:center}
footer a{color:var(--faint)}
@media (max-width:820px){
  .cols{grid-template-columns:1fr;gap:0}
  .rail{position:static;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .rail h3{width:100%;margin-bottom:4px}
  .rail a{display:inline-flex;border:1px solid var(--rule);padding:4px 11px}
  .rail .sect{margin-top:10px;width:100%}
}
@media (max-width:640px){
  .masthead h1{font-size:24px}
  .item h2{font-size:17px}
  input[type=search]{width:150px}
  .tools{margin-left:0;width:100%}
}

/* A sorted card leaves the list. It collapses rather than vanishing, so the
   eye can follow where it went and the cards below do not jump. */
.item{transition:opacity .18s ease,transform .18s ease}
.item.going{opacity:0;transform:translateX(-14px)}
.item.busy{opacity:.5;pointer-events:none}

/* Because the card disappears, a misclick needs a way back. */
#undobar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:10px;
  background:var(--ink);color:#fff;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:50}
#undobar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#undobar button{background:none;border:0;color:var(--accent-2);font:inherit;
  font-weight:700;cursor:pointer;padding:0}
#undobar button:hover{text-decoration:underline}
</style></head><body>
<div class="masthead"><div class="wrap">
  <h1>Louise&#39;s AI News Tracker</h1>
  <p class="standfirst">New work on AI governance, geopolitics, safety, research and deployment,
  gathered every day and read once a week, properly.</p>
</div></div>
{% block nav %}{% endblock %}
<div class="wrap">{% block body %}{% endblock %}</div>
<footer><div class="wrap">build {{ build }} · {{ total_articles }} articles · <a href="/logout">sign out</a></div></footer>
<div id="undobar" role="status" aria-live="polite">
  <span id="undotext"></span><button type="button" id="undobtn">Undo</button>
</div>
<script>
(function () {
  // Progressive enhancement: without this the forms post and redirect as
  // before. With it, a decision is a background POST and the card is removed
  // here, so the page never reloads and the scroll position is kept.
  var bar = document.getElementById('undobar');
  var text = document.getElementById('undotext');
  var btn = document.getElementById('undobtn');
  var timer = null, undo = null;

  // Changing the week goes straight there. This is safe to auto-submit in a
  // way the category dropdown was not: picking a week only changes what you
  // are looking at, where picking a category rewrote an article. The Go
  // button stays for anyone without JavaScript.
  var weekSel = document.querySelector('select[name="week"]');
  if (weekSel) {
    weekSel.addEventListener('change', function () { weekSel.form.submit(); });
  }

  // Category tabs: arrows, shown only when there is something off-screen.
  var row = document.querySelector('.tabs .row');
  var prev = document.querySelector('.tabnav.prev');
  var next = document.querySelector('.tabnav.next');
  if (row && prev && next) {
    var refresh = function () {
      var over = row.scrollWidth - row.clientWidth;
      prev.hidden = row.scrollLeft <= 2;
      next.hidden = over <= 2 || row.scrollLeft >= over - 2;
    };
    var nudge = function (dir) {
      row.scrollBy({left: dir * Math.max(160, row.clientWidth * 0.6),
                    behavior: 'smooth'});
    };
    prev.addEventListener('click', function () { nudge(-1); });
    next.addEventListener('click', function () { nudge(1); });
    row.addEventListener('scroll', refresh, {passive: true});
    window.addEventListener('resize', refresh);
    // Open on a later tab and it should already be in view.
    var on = row.querySelector('.tab.on');
    if (on) on.scrollIntoView({block: 'nearest', inline: 'nearest'});
    refresh();
  }

  var counter = document.getElementById('tosort');
  function bump(n) {
    if (!counter) return;
    counter.textContent = Math.max(0, (parseInt(counter.textContent, 10) || 0) + n);
  }

  function post(action, body) {
    return fetch(action, {
      method: 'POST',
      headers: {'X-Requested-With': 'fetch',
                'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams(body)
    });
  }

  function toast(label, restore) {
    undo = restore || null;
    btn.hidden = !undo;
    text.textContent = label;
    bar.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { bar.classList.remove('show'); undo = null; }, 9000);
  }

  btn.addEventListener('click', function () {
    if (undo) undo();
    bar.classList.remove('show');
    undo = null;
  });

  function remove(item, label, url, undoAction, counted) {
    // Keep the node and its position so Undo can put it back exactly.
    var parent = item.parentNode, next = item.nextSibling;
    item.classList.add('going');
    setTimeout(function () { item.remove(); }, 180);
    if (counted) bump(-1);
    toast(label, function () {
      post('/act', {url: url, action: undoAction, back: location.href})
        .then(function () {
          item.classList.remove('going');
          parent.insertBefore(item, next);
          if (counted) bump(1);
        });
    });
  }

  document.addEventListener('change', function (e) {
    var box = e.target;
    if (!box.classList || !box.classList.contains('relbox')) return;
    var item = box.closest('.item');
    if (item) item.classList.toggle('picked', box.checked);
    post('/act', {url: box.dataset.url, back: location.href,
                  action: box.checked ? 'newsletter' : 'unnewsletter'});
  });

  document.addEventListener('submit', function (e) {
    var form = e.target;

    if (form.classList.contains('ideas')) {
      var box = form.querySelector('textarea');
      var written = (box.value || '').trim();
      if (!written) { e.preventDefault(); return; }
      e.preventDefault();
      post('/idea', {body: written, back: location.href});
      box.value = '';
      toast('Saved to your notes', null);
      return;
    }

    var item = form.closest('.item');
    if (!item) return;
    var url = item.dataset.url;
    var action = form.getAttribute('action');

    // Which button was used; the browser only tells us via the submitter.
    var pressed = e.submitter && e.submitter.name === 'action'
      ? e.submitter.value : null;

    var body = {};
    new FormData(form).forEach(function (v, k) { body[k] = v; });
    body.back = location.href;
    if (pressed) body.action = pressed;

    if (action === '/act' && pressed) {
      e.preventDefault();
      if (pressed === 'clear') {
        // Undo on a kept or rejected list: it is unsorted again, so it
        // belongs back on the pending pile, not on this one.
        post(action, body);
        item.classList.add('going');
        setTimeout(function () { item.remove(); }, 180);
        bump(1);
        return;
      }
      var words = {keep: 'Kept', reject: 'Rejected'};
      post(action, body);
      remove(item, words[pressed] || 'Sorted', url, 'clear', true);
      return;
    }

    if (action === '/move') {
      if (!body.stream) { e.preventDefault(); return; }
      e.preventDefault();
      item.classList.add('busy');
      post(action, body).then(function () {
        // The category tabs filter the list, so a card moved out of the
        // category you are looking at no longer belongs on screen.
        var tab = document.querySelector('.tab.on');
        var viewing = tab ? new URL(tab.href, location).searchParams.get('stream') : 'all';
        item.classList.remove('busy');
        if (viewing && viewing !== 'all' && viewing !== body.stream) {
          item.classList.add('going');
          setTimeout(function () { item.remove(); }, 180);
        } else {
          var kick = item.querySelector('.kicker');
          var opt = form.querySelector('option[value="' + body.stream + '"]');
          if (kick && opt) {
            kick.textContent = opt.textContent.trim();
            kick.className = 'kicker kick-' + body.stream;
          }
        }
      });
      return;
    }

    if (action === '/note') {
      e.preventDefault();
      var box = form.querySelector('textarea');
      var written = (box.value || '').trim();
      if (!written) return;
      post(action, body);
      box.value = '';

      // Show it straight away rather than reloading, which is what threw the
      // scroll position away in the first place.
      var list = item.querySelector('.notes');
      if (!list) {
        list = document.createElement('div');
        list.className = 'notes';
        item.insertBefore(list, item.querySelector('.acts'));
      }
      var note = document.createElement('div');
      note.className = 'note';
      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = new Date().toLocaleDateString('en-GB',
        {day: '2-digit', month: 'short'});
      note.appendChild(when);
      note.appendChild(document.createTextNode(' ' + written));
      list.appendChild(note);
      return;
    }

    if (action === '/note/delete') {
      e.preventDefault();
      post(action, body);
      var n = form.closest('.note');
      if (n) n.remove();
    }
  });
})();
</script>
<script>
(function () {
  var btn = document.getElementById('copymd');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var out = [];
    document.querySelectorAll('#digest .dgroup').forEach(function (g) {
      out.push('## ' + g.querySelector('.dhead').childNodes[0].textContent.trim(), '');
      g.querySelectorAll('.ditem').forEach(function (it) {
        var a = it.querySelector('h3 a');
        var meta = it.querySelector('.dmeta');
        var sum = it.querySelector('.dsum');
        var why = it.querySelector('.dwhy');
        out.push('**[' + a.textContent.trim() + '](' + a.href + ')**');
        out.push('*' + meta.textContent.replace(/\s+/g, ' ').trim() + '*');
        if (sum) out.push('', sum.textContent.trim());
        if (why) out.push('', '> ' + why.textContent.trim());
        it.querySelectorAll('.dnote').forEach(function (n) {
          out.push('', 'My note: ' + n.textContent.trim());
        });
        out.push('');
      });
    });
    var text = out.join('\n');
    navigator.clipboard.writeText(text).then(function () {
      var was = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = was; }, 1600);
    });
  });
})();
</script>
