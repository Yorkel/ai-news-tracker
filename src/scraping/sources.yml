    scraper: src.scraping.rss_adapter
    params: {feed_url: "https://www.gov.uk/government/organisations/ai-safety-institute.atom"}
    disabled: false
    # ⚠️ 20 entries but latest is 2025-10-22 — ~10 months stale. CADENCE flagged
    # that the AI Safety → AI Security Institute rename may have moved output to
    # a new gov.uk org page. Verify before trusting; the live page may differ.

