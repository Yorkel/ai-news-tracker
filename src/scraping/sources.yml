# AI News Tracker — source roster.
#
# Derived 2026-08-29 from two empirical repos (01_GRAND_CHALLENGES and CADENCE),
# cross-checked against Yorkel/ai_tracker. Every feed below was validated through
# feedparser — the same library rss_adapter uses — and had a non-zero entry count
# and a plausible latest-item date on 2026-08-29. Feeds that merely returned
# HTTP 200 with valid XML were NOT accepted: see ada_lovelace under KNOWN GAPS.
#
# EVERYTHING IS disabled: true. Per README, test each one before enabling:
#   1. Confirm its domain is in relevance.approved_domains in config/domain.yml.
#   2. python -m src.scraping.try_source <name>
#   3. Flip `disabled: false` once the output looks right.
#
# apply_relevance_filter: true is set on publishers that cover many topics, so
# an item must also match a relevance keyword. Feeds that are already
# AI-scoped by construction do not carry it.
#
# type: rss | web | newsletter | google_alert

sources:

  # ─────────────────────────────────────────────────────────────────────
  # UK government and regulators
  # ─────────────────────────────────────────────────────────────────────

  - name: govuk_ai_search
    type: rss
    scraper: src.scraping.rss_adapter
    params: {feed_url: "https://www.gov.uk/search/all.atom?keywords=artificial+intelligence"}
    disabled: false
    # Keyword search across ALL of gov.uk — already AI-scoped, so no extra filter.
    # Widest single net for UK government AI output. 10 entries, current.

  - name: dsit
    type: rss
    scraper: src.scraping.rss_adapter
    params:
      feed_url: "https://www.gov.uk/government/organisations/department-for-science-innovation-and-technology.atom"
      apply_relevance_filter: true
    disabled: false
    # Tier 1 in both source reports. Covers all DSIT work, not just AI.

  - name: ai_security_institute
