#                 upstream because that test checked status + XML but not items.
#                 Chase by hand; this is the biggest single gap in the roster.
# From *AI_SAFETY, tested and NOT resolving (its [CONVENTION] guesses):
#   ailabwatch.org, aisi.gov.uk/blog, apartresearch.com, apolloresearch.ai/blog,
#   civai.org, darioamodei.com, epoch.ai/gradient-updates, hai.stanford.edu,
#   iaps.ai, internationalaisafetyreport.org, joecarlsmith.com, rand.org,
#   safe.ai, theaidigest.org, transformer-circuits.pub (403)
#   → METR and GovAI DID resolve and are listed above. Anthropic Alignment
#     Science, Epoch and Apollo remain feedless: type: web candidates.
# Excluded as dormant (validated, but stale): ai-alignment.com (2023-04),
#   cold-takes.com (2024-01, source repo calls it "largely dormant"),
#   defacc.substack.com (2024-07, 3 entries).
#
# aisi.gov.uk   — ⚠️ AISI's own domain (from AI-Governance-Analysis-UK-ROI) has NO
#                 feed: /feed, /rss.xml and /news/rss.xml all 404. The gov.uk org
#                 feed above is the only machine-readable route and it is stale.
#                 Strong candidate for a type: web scraper.
# No feed at any tried path: oecd.ai [corpus wt 21], oireachtas.ie [21],
#   gov.scot [29], audit.scot [9], ico.org.uk [6], dataprotection.ie [5],
#   edps.europa.eu (403), enisa, techuk, policyreview.info, cyber.harvard.edu,
#   abebabirhane.com, holyrood.com, euractiv.com (403), iiea, ceps (500),
#   scottishai.com, adaptcentre.ie (feed exists, zero entries)
#   → TRACE verified NON-RSS routes for three of the highest-weight ones:
#       gov.scot        → gov.scot/sitemap.xml  (sitemap, live)
#       oireachtas.ie   → api.oireachtas.ie/v1/  (API)
#       UK Parliament   → questions-statements-api.parliament.uk, committees-api…
#     These need a type: web / custom adapter, not rss_adapter.
#
# turing        — 403 to both feedparser and a browser UA. Genuinely blocked.
# tony_blair_institute — institute.global/feed returns 429 (rate-limited), which
#                 implies the path exists. Retry later, slowly.
# lero          — https://lero.ie/feed does not resolve. Try a DCU-hosted path.
# our_ai_collective — ouraicollective.org fails DNS. Distinctive Scottish civil
#                 society voice; get the real domain from the participant record.
# scottish_ai_alliance — ⚠️ wound down March 2026. Do not chase.
# No feed advertised on the homepage and none found by convention:
#   epoch.ai, apolloresearch.ai, dataprotection.ie (Irish DPC), gov.scot,
#   ico.org.uk, nesta.org.uk, oecd.ai, anthropic.com/news
#   → these are the candidates for Google Alerts (type: google_alert) or a
#     custom type: web scraper. Anthropic needs a scraper; it has no feed.
