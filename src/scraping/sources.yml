  # large platforms, so its regulators and press carry stories nowhere else
  # does. All general-news feeds, so all filtered AND body-matched: Irish
  # coverage of AI often runs under a business or policy headline.
  #
  # ⚠️ NOT ADDED: the Business Post (businesspost.ie). Its homepage advertises
  # /feed/ but that URL serves HTML, not RSS — the feed is disabled. Worth
  # re-checking; it is the obvious Irish business title for this beat.
  # ─────────────────────────────────────────────────────────────────────

  - name: business_post
    type: web
    scraper: src.scraping.news_sitemap_adapter
    params:
      feed_url: "https://www.businesspost.ie/news-sitemap.xml"
      apply_relevance_filter: true
    disabled: false
    # Ireland's business paper. NO RSS: /feed/ and every other feed path return
    # the site's HTML shell, and /wp-json returns an empty array. Its Google
    # News sitemap carries 106 recent articles with title and date, so it is
    # ingested via news_sitemap_adapter instead.
    #
    # ⚠️ TITLE-ONLY filtering regardless of match_body: run.py filters BEFORE
    # backfilling bodies, and a sitemap supplies no body text, so there is
    # nothing for a body match to read at filter time. A Business Post AI story
    # headlined purely in business terms will be missed.
