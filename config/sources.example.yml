# Copy this file to src/scraping/sources.yml, then replace the examples.
# Keep disabled: true until the source has been tested with src.scraping.try_source.

sources:
  - name: example_feed
    type: rss
    disabled: true
    params:
      feed_url: "https://example.org/feed.xml"
    apply_relevance_filter: true

  - name: example_listing_page
    type: web
    disabled: true
    scraper: auto_listing
    params:
      start_url: "https://example.org/news"
      link_selector: "a"
    apply_relevance_filter: true
