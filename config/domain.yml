# ─────────────────────────────────────────────────────────────────────────
# WEEK ANCHOR
#
# The publishing week runs from this weekday to the day before it, and every
# part of the pipeline reads it from here: the scrape's --weekly-backfill
# windows, articles.week_number, the dashboard's week selector and the weekly
# reset.
#
# Friday starts the publishing week, so the curator's review window ends on
# Thursday before newsletter preparation.
#
# ⚠️ Changing this shifts week_number for articles ALREADY stored. Existing
# rows keep the number they were given at scrape time; only new rows use the
# new anchor. Do not change it again once issues have been published.
week:
  anchor_day: friday

summaries:
  publication_name: AI news tracker digest
  style: Short, factual, close to the source text, no added interpretation.
  unavailable_text: Summary unavailable

relevance:
  # Matched against the title by default; selected sources opt into body matching.
  keywords:
    - ai
    - artificial intelligence
    # House styles that punctuate the abbreviation. The New York Times and
    # several others write "A.I."; without these every one of their AI stories
    # failed the title filter. Needs the lookaround branch in
    # compile_keyword_patterns() to match — see the note there.
    - a.i.
    - a.i
    - machine learning
    - deep learning
    - neural network
    - large language model
    - llm
    - foundation model
    - frontier model
    - generative ai
    - genai
    - chatbot
    - algorithm
    - algorithmic
    - automated decision
    - facial recognition
    - computer vision
    - ai act
    - ai safety
    - ai governance
    - ai regulation
    - ai policy
    - responsible ai
    - trustworthy ai
    - model evaluation
    - benchmark
    - compute
    - gpu
    - openai
    - anthropic
    - deepmind
    - hugging face
    # Added 2026-08-29. *AI_SAFETY records two institutional renames — UK AI
    # Safety Institute → AI Security Institute (Feb 2025) and US AISI → CAISI
    # (Jun 2025) — and warns that "any keyword filter built on 'AI Safety
    # Institute' silently loses both". Both spellings are listed.
    - ai safety institute
    - ai security institute
    - caisi
    - aisi
    # Technical safety and evals vocabulary — the roster now carries alignment
    # and evals sources whose articles the original keyword list would miss.
    - alignment
    - misalignment
    - interpretability
    - red team
    - red-teaming
    - system card
    - model card
    - ai control
    - scheming
    - sandbagging
    - frontier ai
    - agentic
    - superintelligence
    - existential risk
    # Added after the 2026-08-29 dry run: the Guardian's AI section carried
    # datacentre-energy stories that the title-only filter dropped. AI compute
    # demand is in scope, so these spellings are needed.
    - datacentre
    - datacentres
    - data centre
    - data centres
    - data center
    - data centers
    # compile_keyword_patterns() is word-boundary exact with NO plural
    # handling, so \bdatacentre\b does not match "datacentres". Plurals of
    # countable nouns must be listed explicitly. Verified 2026-08-29 against
    # Guardian AI-section headlines. Not adding plurals for "ai" or "compute",
    # where an optional -s would create false matches.
    - chatbots
    - algorithms
    - benchmarks
    - foundation models
    - frontier models
    - large language models
    - llms
    - model evaluations
    - system cards
    - model cards

