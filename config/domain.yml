      - arxiv_cs_ai
      - arxiv_cs_lg

# ─────────────────────────────────────────────────────────────────────────
# GEOGRAPHY — a FILTER inside every stream, not a stream of its own.
#
# Place and topic are different axes: a DSIT story is UK *and* governance,
# so making UK a stream would force it out of one or the other. As a filter
# it composes — "UK stories in Governance", "Irish geopolitics".
#
# Derived from the SOURCE, like streams. articles.country is not usable for
# this: geography.default_country is 'uk', so every row is labelled uk
# regardless of where the publisher is.
# ─────────────────────────────────────────────────────────────────────────
places:
  order: [UK, Ireland, EU, US, Global]
  # Scotland, Wales and Northern Ireland sit UNDER UK rather than having their
  # own chips. They were briefly separate, which put three near-empty tabs
  # beside a busy one. The devolved Google News queries still exist as distinct
