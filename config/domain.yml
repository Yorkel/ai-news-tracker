project:
  name: AI News Tracker
  description: AI governance, AI news, and AI/ML research ingestion, ranking, and curator review.
  audience: Louise Yorke

database:
  article_table: articles
  classification_table: classify_newsletter
  dashboard_view: v_dashboard

# Curator-facing category labels used by the dashboard.
labels:
  order:
    - governance
    - research
    - industry
    - safety
    - tooling
    - other
  display:
    governance: Governance, policy and regulation
    research: Research and evaluation
    industry: Industry, funding and adoption
    safety: Safety, incidents and evaluations
    tooling: Models, tooling and releases
    other: Other relevant updates
  short:
    governance: Governance
    research: Research
    industry: Industry
    safety: Safety
    tooling: Tooling
    other: Other
  # Sunset palette — kept in step with dashboard/palette.py.
  colors:
    governance: "#7B4FA8"   # dusk violet
    research: "#4A63A8"     # twilight blue
    industry: "#F2683C"     # sunset orange
    safety: "#C2325C"       # sunset crimson
    tooling: "#E9A13B"      # gold
    other: "#9A8296"        # mauve grey

# ─────────────────────────────────────────────────────────────────────────
# STREAMS — the four lanes the dashboard splits articles into.
#
# A stream is decided by which source published the article. That is
# deterministic and re-buckets
# the whole corpus the instant this file changes — nothing is stored on the
# article row, so there is no migration and no re-ingest.
#
# `geopolitics` is the exception: world/security news cuts across every source
# rather than belonging to particular ones, so any article whose TITLE matches
# `geopolitics.keywords` is routed there regardless of its source. Source
# assignment is the default; the keyword rule overrides it.
# ─────────────────────────────────────────────────────────────────────────
streams:
  order: [governance, geopolitics, safety, research, technical, deployment,
          podcasts, papers]

  # `papers` is deliberately last and deliberately separate. arXiv publishes
  # ~150 preprints a week to cs.CY alone, three times the next biggest source,
  # and mixing that into the news would mean the news is never read. It is kept
  # out of the All tab and exports to its own CSV; see `exclude_from_all`.
  exclude_from_all: [papers]

  governance:
    display: "AI governance, policy and news"
    short: "Governance & policy"
    description: "Regulators, legislation, civil society and the impact of AI on policy."
    sources:
