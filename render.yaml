# Optional Render web-service template for the classifier API.
# Many trackers deploy the same Docker image on Hugging Face Spaces or another
# container host instead. Review resource limits before enabling this file.

services:
  - type: web
    name: news-tracker-classifier
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CLASSIFIER_API_KEY
        sync: false
      - key: DISABLE_DOCS
        value: "1"
